name: Bug report
description: Something does not work as expected.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check that it is not [already reported](https://github.com/OmegaSoftDLL/omegadesk/issues).

        **Security problems must not be reported here.** Follow [SECURITY.md](https://github.com/OmegaSoftDLL/omegadesk/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the agent with `...`
        2. Connect with `...`
        3. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Agent (shared machine)
        - Client (connecting machine)
        - Video (capture, encoding, decoding)
        - Keyboard and mouse
        - Network and connection
        - Build or CI
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Of the machine where the problem happens. You may select more than one.
      multiple: true
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OmegaDesk version or commit
      placeholder: e.g. 0.1.0 or 5174ae8
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: GPU and CPU
      description: Relevant for video problems.
      placeholder: e.g. Intel Core Ultra 5 135U with Intel Arc graphics
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Agent and client logs. Run with `RUST_LOG=debug` for more detail. Remove passwords and fingerprints first.
      render: text
