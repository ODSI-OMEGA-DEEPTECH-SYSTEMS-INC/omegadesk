[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/ODSI-OMEGA-DEEPTECH-SYSTEMS-INC/omegadesk"
publish = false

[workspace.dependencies]
omegadesk-identity = { path = "crates/identity" }
omegadesk-protocol = { path = "crates/protocol" }

bytes = "1"
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
prost = "0.13"
prost-build = "0.13"
protox = "0.7"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
wildcard_enum_match_arm = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
