# OmegaDesk dependency policy (cargo-deny).
# The project is AGPL-3.0: only licenses compatible with it are accepted.

[graph]
all-features = true
# Only the platforms we ship to; keeps Windows-only or iOS-only crates from
# other targets out of the license and bans checks.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
# OpenSSL: we use rustls and ring everywhere; a second TLS stack is a bug.
deny = [{ name = "openssl" }, { name = "openssl-sys" }]
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
